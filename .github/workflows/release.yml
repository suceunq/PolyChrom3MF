name: Publier une version Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Tester
        run: dotnet test PolyChrom3MF.sln -c Release

      - name: Publier l'application autonome
        run: dotnet publish PolyChrom3MF.App/PolyChrom3MF.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/app

      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Construire l'installateur
        run: iscc /DAppPublishDir=publish/app installer.iss

      - name: Préparer les notes de version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $source = "RELEASE_NOTES_$version.md"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Notes de version absentes : $source"
          }
          Copy-Item -LiteralPath $source -Destination release-notes.md

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-notes.md
          files: LIVRAISON_FINALE/Installateur/PolyChrom3MF_Setup_x64.exe
