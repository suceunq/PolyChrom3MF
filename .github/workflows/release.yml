name: Publier une version Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer .NET 8
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Tester
        run: dotnet test PolyChrom3MF.sln -c Release

      - name: Publier l'application autonome
        run: dotnet publish PolyChrom3MF.App/PolyChrom3MF.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o publish/app

      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Construire l'installateur
        run: iscc /DAppPublishDir=publish/app installer.iss

      - name: Préparer les notes de version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $source = "RELEASE_NOTES_$version.md"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Notes de version absentes : $source"
          }
          Copy-Item -LiteralPath $source -Destination release-notes.md

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: release-notes.md
          files: LIVRAISON_FINALE/Installateur/PolyChrom3MF_Setup_x64.exe

      - name: Signer et publier le manifeste de mise à jour
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_KEY)) {
            throw "Secret UPDATE_SIGNING_KEY absent : le manifeste de mise à jour n'a pas été publié."
          }
          $version = $env:RELEASE_TAG -replace '^v', ''
          $keyPath = Join-Path $env:RUNNER_TEMP 'update-signing-key.pem'
          $manifestPath = Join-Path $env:RUNNER_TEMP 'update.json'
          Set-Content -LiteralPath $keyPath -Value $env:UPDATE_SIGNING_KEY -Encoding ascii
          try {
            dotnet run --project tools/SignUpdateManifest -c Release -- --version $version --key $keyPath --installer LIVRAISON_FINALE/Installateur/PolyChrom3MF_Setup_x64.exe --out $manifestPath
            if ($LASTEXITCODE -ne 0) { throw "Signature du manifeste en échec." }
          }
          finally {
            Remove-Item -LiteralPath $keyPath -Force -ErrorAction SilentlyContinue
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if ($LASTEXITCODE -ne 0) { throw "git fetch en échec." }
          git checkout -B main origin/main
          if ($LASTEXITCODE -ne 0) { throw "git checkout en échec." }
          Copy-Item -LiteralPath $manifestPath -Destination update.json -Force
          git add update.json
          git commit -m "Publier le manifeste signé $version"
          if ($LASTEXITCODE -ne 0) { throw "git commit en échec." }
          git push origin main
          if ($LASTEXITCODE -ne 0) { throw "git push du manifeste en échec." }
